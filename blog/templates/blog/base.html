{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'blog/css/style.css' %}?v=5">
    <title>
        {% block title %}
            Mon Blog
        {% endblock title %}
    </title>
</head>
<body>
    

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top" style="background-color:#1a237e;">
        <div class="container">

            <a class="navbar-brand d-flex align-items-center" href="{% url 'accueil' %}">
                <img src="{% static 'blog/image/7786_danse-bamendjou-3.jpg' %}"
                     alt="Logo"
                     width="60"
                     height="60"
                     class="rounded-circle me-2">
                <span class="fw-bold fs-4 text-white">Mon Blog</span>
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuNavbar"
                    aria-controls="menuNavbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuNavbar">

                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'accueil' %}active{% endif %}" href="{% url 'accueil' %}">
                            Accueil
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'blog' %}active{% endif %}" href="{% url 'blog' %}">
                            Blog
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}" href="{% url 'contact' %}">
                            Contact
                        </a>
                    </li>
                </ul>

                <a href="/admin/login/" class="btn btn-outline-light">
                    Connexion
                </a>

            </div>

        </div>
    </nav>

    {% block content %}
    {% endblock content %}

    <footer class="footer mt-5">

    <div class="container">

        <div class="footer-content">

            <div class="footer-logo">
                <h4>Mon Blog</h4>
                <p>Découvrez des articles inspirants et partagez vos idées.</p>
            </div>

            <div class="footer-links">

                <a href="{% url 'accueil' %}">Accueil</a>

                <a href="{% url 'blog' %}">Blog</a>

                <a href="{% url 'contact' %}">Contact</a>

            </div>

        </div>

        <hr>

        <p class="copyright">
            © 2026 Mon Blog - Tous droits réservés.
        </p>

    </div>

</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
